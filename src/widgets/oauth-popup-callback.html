<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Phonemos sign-in</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 24px;
        color: #1b1b1b;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #f2f2f2;
          background: #1b1b1b;
        }
      }
    </style>
  </head>
  <body>
    <h1>Phonemos</h1>
    <p id="msg">Completing sign-in…</p>
    <script>
      (function () {
        var MESSAGE_TYPE = 'phonemos:oauth';
        var APP_NAME = 'phonemos';
        var params = new URLSearchParams(window.location.search);
        if (!params.get('code') && !params.get('error') && window.location.hash) {
          var hash = window.location.hash.charAt(0) === '#' ? window.location.hash.slice(1) : window.location.hash;
          if (hash.indexOf('=') >= 0) {
            params = new URLSearchParams(hash);
          }
        }
        var code = params.get('code');
        var state = params.get('state');
        var error = params.get('error_description') || params.get('error');
        var msg = document.getElementById('msg');
        if (!(code || error)) {
          msg.textContent = 'No authorization response found. You can close this window.';
          return;
        }

        var payload = {
          type: MESSAGE_TYPE,
          code: code,
          state: state,
          error: error,
          ts: Date.now(),
        };

        function publishLocal() {
          var serialized = JSON.stringify(payload);
          try {
            window.name = 'phonemos-oauth:' + serialized;
          } catch (e) {}
          try {
            if (window.opener) {
              window.opener.postMessage(payload, '*');
            }
          } catch (e) {}
          try {
            localStorage.setItem('phonemos:oauth-result', serialized);
          } catch (e) {}
          try {
            var channel = new BroadcastChannel('phonemos-oauth');
            channel.postMessage(payload);
            channel.close();
          } catch (e) {}
        }

        function closeSoon() {
          setTimeout(function () {
            try {
              window.location.replace('about:blank');
            } catch (e) {
              try {
                window.close();
              } catch (e2) {}
            }
          }, 400);
        }

        // Finish token exchange on the YouTrack backend using the browser session.
        // This survives the ticket widget remounting after the popup closes.
        var completeUrl =
          window.location.origin +
          '/api/extensionEndpoints/' +
          encodeURIComponent(APP_NAME) +
          '/backend/oauth/complete';

        msg.textContent = 'Finishing sign-in…';
        fetch(completeUrl, {
          method: 'POST',
          credentials: 'same-origin',
          headers: {
            Accept: 'application/json',
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            code: code,
            state: state,
            error: error,
          }),
        })
          .then(function (response) {
            return response
              .json()
              .catch(function () {
                return {success: false, message: 'HTTP ' + response.status};
              })
              .then(function (data) {
                return {ok: response.ok, data: data || {}};
              });
          })
          .then(function (result) {
            publishLocal();
            if (error) {
              msg.textContent = 'Sign-in failed: ' + error;
              closeSoon();
              return;
            }
            if (result.data && result.data.connected) {
              msg.textContent = 'Signed in. You can close this window.';
            } else if (result.data && result.data.success) {
              msg.textContent =
                'Signed in (waiting for ticket widget). You can close this window.';
            } else {
              msg.textContent =
                'Sign-in may be incomplete: ' +
                ((result.data && result.data.message) || 'unknown error') +
                '. You can close this window.';
            }
            closeSoon();
          })
          .catch(function (e) {
            publishLocal();
            msg.textContent =
              'Could not reach YouTrack to finish sign-in (' +
              (e && e.message ? e.message : 'network error') +
              '). You can close this window.';
            closeSoon();
          });
      })();
    </script>
  </body>
</html>
