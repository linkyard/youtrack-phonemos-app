<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Phonemos connect</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 24px;
        color: #1b1b1b;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #f2f2f2;
          background: #1b1b1b;
        }
      }
    </style>
  </head>
  <body>
    <h1>Phonemos</h1>
    <p id="msg">Connecting…</p>
    <script>
      (function () {
        var MESSAGE_TYPE = 'phonemos:oauth';
        var ACK_TYPE = 'phonemos:oauth-ack';
        var params = new URLSearchParams(window.location.search);
        if (!params.get('code') && !params.get('error') && window.location.hash) {
          var hash = window.location.hash.charAt(0) === '#' ? window.location.hash.slice(1) : window.location.hash;
          if (hash.indexOf('=') >= 0) {
            params = new URLSearchParams(hash);
          }
        }
        var code = params.get('code');
        var state = params.get('state');
        var error = params.get('error_description') || params.get('error');
        var msg = document.getElementById('msg');
        if (!(code || error)) {
          msg.textContent = 'No authorization response found. You can close this window.';
          return;
        }

        var payload = {
          type: MESSAGE_TYPE,
          code: code,
          state: state,
          error: error,
          ts: Date.now(),
        };

        // YouTrack widgets run in about:srcdoc (opaque origin). A concrete
        // targetOrigin never matches, so the opener must be addressed with '*'.
        // The opener still requires event.source === this popup and matching state.
        var opener = window.opener || (window.top && window.top.opener) || null;
        var acked = false;

        function notifyOpener() {
          try {
            window.name = 'phonemos-oauth:' + JSON.stringify(payload);
          } catch (e) {}
          try {
            if (opener) {
              opener.postMessage(payload, '*');
            }
          } catch (e) {}
        }

        function closeNow() {
          try {
            window.close();
          } catch (e) {}
        }

        // Retry until the opener explicitly acknowledges receipt — don't guess a
        // delay/retry count. Whichever channel it actually caught us on (postMessage,
        // window.name poll, or the oauth/pending poll), it tells us so here, and only
        // then do we close. The timeout below is just a safety net in case the opener
        // never shows up at all (e.g. the widget was closed or crashed).
        var retryTimer = setInterval(notifyOpener, 400);
        notifyOpener();

        window.addEventListener('message', function (event) {
          var data = event.data;
          if (acked || !data || data.type !== ACK_TYPE || data.state !== state) {
            return;
          }
          if (opener && event.source !== opener) {
            return;
          }
          acked = true;
          clearInterval(retryTimer);
          closeNow();
        });

        setTimeout(function () {
          if (acked) {
            return;
          }
          clearInterval(retryTimer);
          closeNow();
        }, 60000);

        if (error) {
          msg.textContent = 'Connection failed: ' + error;
        } else {
          msg.textContent = 'Connected. You can close this window.';
        }
      })();
    </script>
  </body>
</html>
