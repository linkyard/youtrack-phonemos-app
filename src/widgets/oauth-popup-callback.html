<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Phonemos connect</title>
    <style>
      :root {
        color-scheme: light;
        color: rgb(39, 40, 46);
        background: rgb(255, 255, 255);
      }
      :root.theme-dark {
        color-scheme: dark;
        color: rgb(255, 255, 255);
        background: rgb(30, 31, 34);
      }
      body {
        font-family: system-ui, sans-serif;
        padding: 24px;
      }
    </style>
    <script>
      var themeMatch = /^phonemos-oauth-.*-(dark|light)$/.exec(window.name);
      var isDark = themeMatch ? themeMatch[1] === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (isDark) document.documentElement.classList.add('theme-dark');
    </script>
  </head>
  <body>
    <h1>Phonemos</h1>
    <div id="msg"><p>Connecting…</p></div>
    <script>
      var MESSAGE_TYPE = 'phonemos:oauth';

      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var state = params.get('state');
      var error = params.get('error_description') || params.get('error');
      var msg = document.getElementById('msg');

      // Present feedback without any prompt injection
      function showMessage(msgList) {
        msg.replaceChildren();
        for (var i = 0; i < msgList.length; i++) {
          var p = document.createElement('p');
          p.textContent = msgList[i];
          msg.appendChild(p);
        }
      }

      if (!(code || error)) {
        show('Error: No authorization response found.', 'You can close this window.');

      } else if (error) {
        show('Received an error from the connection attempt.', error, 'You can close this window.');

      } else {

        var payload = {type: MESSAGE_TYPE, code: code, state: state, error: error, ts: Date.now()};
        var opener = window.opener || (window.top && window.top.opener) || null;

        try {
          if (opener) {

            opener.postMessage(payload, '*');
            setTimeout(() => opener.postMessage(payload, '*'), 200);
            setTimeout(() => opener.postMessage(payload, '*'), 400);
            setTimeout(() => opener.postMessage(payload, '*'), 600);

            show('Successfully connected.', 'This window will close automatically…');
            setTimeout(() => window.close(), 800);

          } else {
            show('Error: Unable to connect to the main window.', 'You can close this window.');
          }
        } catch (e) {
          show('Error: Unable to connect to the main window.', 'You can close this window.');
        }
      }
    </script>
  </body>
</html>
