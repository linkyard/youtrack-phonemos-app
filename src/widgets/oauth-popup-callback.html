<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Phonemos connect</title>
    <style>
      :root {
        color-scheme: light;
        color: rgb(39, 40, 46);
        background: rgb(255, 255, 255);
      }
      :root.theme-dark {
        color-scheme: dark;
        color: rgb(255, 255, 255);
        background: rgb(30, 31, 34);
      }
      body {
        font-family: system-ui, sans-serif;
        padding: 24px;
      }
    </style>
    <script>
      // The opening widget appends its YouTrack theme to the popup name; fall back to the OS setting.
      var themeMatch = /^phonemos-oauth-.*-(dark|light)$/.exec(window.name);
      var isDark = themeMatch
        ? themeMatch[1] === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (isDark) {
        document.documentElement.classList.add('theme-dark');
      }
    </script>
  </head>
  <body>
    <h1>Phonemos</h1>
    <span id="msg"><p>Connecting…</p></span>
    <script>
      var MESSAGE_TYPE = 'phonemos:oauth';

      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      var state = params.get('state');
      var error = params.get('error_description') || params.get('error');
      var msg = document.getElementById('msg');

      if (!(code || error)) {
        msg.innerHTML = '<p>Error:No authorization response found.<br />You can close this window.</p>';

      } else if (error) {
        msg.innerHTML = '<p>Received an error from connection attempt.<br /><br />' +
          error +
          '<br /><br />You can close this window.</p>';
      
      } else { 

        var payload = {type: MESSAGE_TYPE, code: code, state: state, error: error, ts: Date.now()};
        var opener = window.opener || (window.top && window.top.opener) || null;

        try {
          if (opener) {

            opener.postMessage(payload, '*');
            setTimeout(() => opener.postMessage(payload, '*'), 200);
            setTimeout(() => opener.postMessage(payload, '*'), 400);
            setTimeout(() => opener.postMessage(payload, '*'), 600);

            msg.innerHTML = '<p>Successfully connected.<br />This window will close automatically...</p>'
            setTimeout(() => window.close(), 800);

          } else {
            msg.innerHTML = '<p>Error: Unable to connect to the main window.<br />You can close this window.</p>'
          }
        } catch (e) {
          msg.innerHTML = '<p>Error: Unable to connect to the main window.<br />You can close this window.</p>'
        }
      }
    </script>
  </body>
</html>
